    <script>
      (() => {
        try {
          const key = "invest-calc:theme:v1";
          const saved = localStorage.getItem(key);
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            saved === "dark" || saved === "light"
              ? saved
              : prefersDark
                ? "dark"
                : "light";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {}
      })();
    </script>
    <!-- Critical CSS: invest 테마 — sky-600 블루 톤 -->
    <style>
      :root {
        /* v3 §2.1 역할 토큰(Wave2 레시피 §4) — canvas/card/ink/ink-muted/line/focus는
           hex에서 역산(반올림 왕복 검증 완료, travel a035f62 실측값과 동일).
           --primary(invest 청록/파랑)는 건드리지 않는다 — 구조색만 바꾼다. */
        --background: 60 11.11% 96.47%; /* color.canvas #F7F7F5 */
        --foreground: 0 0% 3.92%; /* color.ink #0A0A0A */
        --muted: 204 40% 96%;
        --muted-foreground: 60 3.37% 34.9%; /* color.ink-muted #5C5C56 */
        --card: 0 0% 100%; /* color.card #FFFFFF */
        --card-foreground: 0 0% 3.92%;
        --primary: 200 85% 32%;
        --primary-foreground: 0 0% 100%;
        --secondary: 200 15% 91%;
        --secondary-foreground: 222 47% 11%;
        --accent: 200 58% 95%;
        --accent-foreground: 200 90% 30%;
        --popover: 0 0% 100%;
        --popover-foreground: 0 0% 3.92%;
        --destructive: 0 72% 52%;
        /* 210 40% 98%는 --destructive 위에서 4.49:1(미달). 순백으로 올려 4.70:1 확보 */
        --destructive-foreground: 0 0% 100%;
        --border: 60 8% 90.2%; /* color.line #E8E8E4 */
        --input: 214 16% 85%;
        --ring: 0 0% 3.92%; /* color.focus #0A0A0A (v3 §2.1 — 포커스는 브랜드색이 아니라 ink) */
        --radius: 0.4rem;
      }

      .dark {
        --background: 0 0% 7.06%; /* color.canvas dark #121212 */
        --foreground: 0 0% 96.08%; /* color.ink dark #F5F5F5 */
        --muted: 217 33% 17%;
        --muted-foreground: 60 3.33% 64.71%; /* color.ink-muted dark #A8A8A2 */
        --card: 0 0% 10.98%; /* color.card dark #1C1C1C */
        --card-foreground: 0 0% 96.08%;
        --primary: 200 85% 55%;
        --primary-foreground: 200 90% 8%;
        --secondary: 200 15% 20%;
        --secondary-foreground: 210 40% 96%;
        --accent: 200 40% 22%;
        --accent-foreground: 198 85% 78%;
        --popover: 0 0% 10.98%;
        --popover-foreground: 0 0% 96.08%;
        --destructive: 0 72% 58%;
        /* 다크 --destructive 위 흰 글자는 4.05:1(미달). --primary-foreground와 같은 방식으로
           hue를 유지한 채 어둡게 내려 4.74:1 확보. Wave2 §4에서 카드가
           0 0% 10.98%로 더 어두워졌지만 재측정 결과 대비는 유지/상승(아래 참조). */
        --destructive-foreground: 0 90% 8%;
        --border: 0 0% 16.47%; /* color.line dark #2A2A2A */
        --input: 214 16% 30%;
        --ring: 0 0% 96.08%; /* color.focus dark #F5F5F5 */
      }

      html {
        scroll-behavior: auto;
        font-size: 16px;
      }

      body {
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        margin: 0;
        color-scheme: light dark;
      }
    </style>
